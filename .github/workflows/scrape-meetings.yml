name: Scrape New Meetings

on:
  schedule:
    # Run daily at 6:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run scraping script
        id: scrape
        working-directory: scraping
        run: |
          set -o pipefail
          uv run main.py 2>&1 | tee scrape_output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat scrape_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate vote data
        run: npx tsx scripts/generate-votes.ts

      - name: Regenerate councillor stats
        run: npx tsx scripts/generate-stats.ts

      - name: Re-add transcripts to regenerated meeting pages
        # The scraper rewrites meeting pages without their transcript section
        # (transcripts live in the JSONs). Without this step, every scrape
        # commit deletes the transcript lines that sync-transcripts re-adds
        # 20 minutes later, and each Railway boot in between purges and
        # re-embeds ~1,000 vector-store chunks to mirror the churn.
        run: npx tsx scripts/add-transcripts-to-pages.ts
        id: changes
        run: |
          # Check for any changes in data/ or content/
          if git diff --quiet data/ && git diff --quiet content/; then
            if [ -z "$(git status --porcelain data/ content/)" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          # Scraper output contains meeting titles scraped from the city's
          # website — pass via env so it can never be interpreted as shell.
          SCRAPE_OUTPUT: ${{ steps.scrape.outputs.output }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          git commit -m "chore: scrape new council meetings [automated]" -m "$SCRAPE_OUTPUT"
          # This workflow, sync-transcripts.yml, and generate-pages.yml all run
          # on daily schedules close enough together that they can race to push
          # to main. Rebase onto the latest main and retry a few times instead
          # of letting a non-fast-forward push throw away this run's real work.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt/5) — fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

      - name: Send success notification
        if: steps.changes.outputs.has_changes == 'true' && vars.EMAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: New meetings scraped"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            New council meetings have been scraped and committed.

            ${{ steps.scrape.outputs.output }}

            View the changes: https://github.com/${{ github.repository }}/commits/main

      - name: Send failure notification
        if: failure() && vars.EMAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: Scraping FAILED"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            The council meeting scraper has FAILED.

            Please check the workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Scraper output:
            ${{ steps.scrape.outputs.output }}
