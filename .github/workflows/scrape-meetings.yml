name: Scrape New Meetings

on:
  schedule:
    # Run daily at 6:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run scraping script
        id: scrape
        working-directory: scraping
        run: |
          set -o pipefail
          uv run main.py 2>&1 | tee scrape_output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat scrape_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate vote data
        run: npx tsx scripts/generate-votes.ts

      - name: Regenerate councillor stats
        run: npx tsx scripts/generate-stats.ts

      - name: Check for changes
        id: changes
        run: |
          # Check for any changes in data/ or content/
          if git diff --quiet data/ && git diff --quiet content/; then
            if [ -z "$(git status --porcelain data/ content/)" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          git commit -m "chore: scrape new council meetings [automated]

          ${{ steps.scrape.outputs.output }}"
          git push

      - name: Send success notification
        if: steps.changes.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: New meetings scraped"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            New council meetings have been scraped and committed.

            ${{ steps.scrape.outputs.output }}

            View the changes: https://github.com/${{ github.repository }}/commits/main

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: Scraping FAILED"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            The council meeting scraper has FAILED.

            Please check the workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Scraper output:
            ${{ steps.scrape.outputs.output }}
