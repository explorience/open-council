name: Sync Transcripts

on:
  schedule:
    # Run daily at 7 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      limit:
        description: 'Maximum meetings to check (0 = all)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '50'
          - '100'
          - '200'
          - '500'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Scan for new transcripts (create transcript-only meetings)
        id: scan
        working-directory: scraping
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERBOSE: "1"
        run: |
          uv run python transcript.py --scan 30 2>&1 | tee scan_output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat scan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sync transcripts to existing meetings
        id: sync
        working-directory: scraping
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          VERBOSE: "1"
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          uv run python transcript.py 2>&1 | tee sync_output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat sync_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate pages for transcript-only meetings
        run: npx tsx scripts/generate-transcript-pages.ts

      - name: Add transcripts to meeting pages
        run: npx tsx scripts/add-transcripts-to-pages.ts

      - name: Check for changes
        id: changes
        run: |
          git add data/ content/months/
          git diff --cached --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync transcripts from Lillian Skinner archive [automated]"
          git push

      - name: Send success notification
        if: steps.changes.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: Transcripts synced"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            Transcripts have been synced and committed.

            Scan output:
            ${{ steps.scan.outputs.output }}

            Sync output:
            ${{ steps.sync.outputs.output }}

            View the changes: https://github.com/${{ github.repository }}/commits/main

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Open Council: Transcript sync FAILED"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Open Council Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            The transcript sync workflow has FAILED.

            Please check the workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
